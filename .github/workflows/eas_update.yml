name: EAS Update

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eas-update-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8 
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

     
      - name: 🚀 Create update
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          eas update \
            --branch main \          
            --message "$COMMIT_MSG" \
            --non-interactive
